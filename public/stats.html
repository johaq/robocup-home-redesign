<style>
:root {
  --bg: #f4f6fb;
  --surface: #fff;
  --surface-2: #edf0f7;
  --border: #cdd4e6;
  --text: #1a1f35;
  --muted: #5c6485;
  --accent: #1d44c4;
  --accent-bg: #eaedff;
  --mono: ui-monospace, 'SF Mono', 'Courier New', monospace;
  --hr: 240; --hg: 243; --hb: 255;
  --hr2: 29;  --hg2: 68;  --hb2: 196;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; line-height: 1.5; background: var(--bg); color: var(--text); }
a { color: var(--accent); }

/* Header */
.page-header { background: var(--accent); color: #fff; padding: 2.5rem 2rem 2rem; }
.page-header .content { max-width: 1100px; margin: 0 auto; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; opacity: .65; margin-bottom: .3rem; }
.page-header h1 { font-size: clamp(1.5rem, 4vw, 2rem); font-weight: 700; letter-spacing: -.02em; margin-bottom: .6rem; }
.header-meta { font-size: 12px; opacity: .65; display: flex; gap: 1.5rem; flex-wrap: wrap; }

/* Content */
.content { max-width: 1100px; margin: 0 auto; padding: 0 1.5rem 4rem; }

/* Tabs */
.tabs-wrap { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 2px solid var(--border); box-shadow: 0 2px 10px rgba(0,0,0,.06); }
.tabs { max-width: 1100px; margin: 0 auto; padding: 0 1.5rem; display: flex; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab-btn { padding: .8rem 1.1rem; background: none; border: none; border-bottom: 3px solid transparent; margin-bottom: -2px; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; transition: color .12s, border-color .12s; }
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

/* Panels */
.test-panel { display: none; padding-top: 2rem; }
.test-panel.visible { display: block; }

/* Stat cards */
.stat-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: .75rem; margin-bottom: 1.5rem; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: .9rem 1rem; }
.stat-label { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: .2rem; }
.stat-value { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; line-height: 1.1; }
.stat-sub { font-size: 11px; color: var(--muted); margin-top: .15rem; }
.stat-card.highlight { border-color: var(--accent); background: var(--accent-bg); }
.stat-card.highlight .stat-value { color: var(--accent); }

/* Section heading inside panel */
.panel-section { margin-top: 1.75rem; }
.panel-section-title { font-size: 10px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; color: var(--muted); padding-bottom: .5rem; border-bottom: 1px solid var(--border); margin-bottom: 1rem; }

/* Progression */
.prog-days { display: flex; gap: .75rem; flex-wrap: wrap; }
.prog-day { flex: 1; min-width: 150px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: .9rem 1rem; }
.prog-day-label { font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: .5rem; }
.prog-bar-wrap { background: var(--surface-2); border-radius: 3px; height: 6px; margin-bottom: .4rem; overflow: hidden; }
.prog-bar { height: 100%; background: var(--accent); border-radius: 3px; }
.prog-score { font-family: var(--mono); font-size: 1.2rem; font-weight: 700; letter-spacing: -.02em; }
.prog-runs { font-size: 11px; color: var(--muted); }
.prog-delta { font-size: 11px; margin-top: .2rem; font-weight: 600; }
.delta-up { color: #16a34a; }
.delta-dn { color: #dc2626; }

/* Progression heat grid */
.prog-grid-wrap { overflow-x: auto; margin-top: 1.25rem; }
.prog-grid-table { border-collapse: collapse; font-size: 11.5px; }
.prog-grid-table th { padding: .4rem .75rem; text-align: left; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid var(--border); white-space: nowrap; background: var(--surface); }
.prog-grid-table td { padding: .35rem .75rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
.prog-grid-table tr:last-child td { border-bottom: none; }
.prog-grid-table .item-name { max-width: 210px; line-height: 1.3; color: var(--text); }
.prog-grid-table .heat-cell { font-family: var(--mono); font-size: 11px; font-weight: 600; text-align: center; width: 72px; }

/* Table card */
.table-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 1rem; }
.table-card-hd { padding: .65rem 1rem; font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.table-wrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.data th { padding: .45rem .75rem; text-align: left; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid var(--border); white-space: nowrap; background: var(--surface); }
table.data th.g-all { background: #eaedff; color: var(--accent); }
table.data th.g-best { background: var(--surface-2); }
table.data td { padding: .4rem .75rem; border-bottom: 1px solid #edf0f7; vertical-align: middle; }
table.data tr:last-child td { border-bottom: none; }
table.data tr:hover td { background: #f8f9fd; }
table.data td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; color: var(--muted); font-size: 12px; }
table.data td.pts { color: var(--accent); font-weight: 700; font-family: var(--mono); text-align: right; font-size: 12px; }
table.data td.heat { font-family: var(--mono); font-size: 11.5px; font-weight: 700; text-align: center; white-space: nowrap; min-width: 56px; border-radius: 0; }
table.data td.item-label { max-width: 260px; line-height: 1.35; font-size: 12.5px; }
table.data td.item-label.penalty { color: var(--muted); font-size: 12px; }
table.data td.context { font-size: 11px; color: var(--muted); max-width: 160px; line-height: 1.3; }
table.data .section-row td { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); background: var(--accent-bg); padding: .3rem .75rem; }

/* Insight chips */
.insights { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
.chip { display: inline-flex; align-items: center; gap: .35rem; padding: .28rem .65rem; border-radius: 20px; font-size: 11px; font-weight: 600; }
.chip-blue { background: var(--accent-bg); color: var(--accent); }
.chip-green { background: #dcfce7; color: #166534; }
.chip-amber { background: #fef9c3; color: #92400e; }
.chip-red { background: #fee2e2; color: #991b1b; }

/* Summary table */
.summary-row td { font-size: 13px; }
.summary-row td.test-name { font-weight: 600; }
.bar-cell { min-width: 110px; }
.mini-bar-wrap { background: var(--surface-2); border-radius: 3px; height: 5px; overflow: hidden; margin-top: 3px; }
.mini-bar { height: 100%; background: var(--accent); border-radius: 3px; }

/* No-prog note */
.no-prog { font-size: 12px; color: var(--muted); padding: .75rem 0; font-style: italic; }

@media (max-width: 600px) {
  .page-header { padding: 1.5rem 1rem 1.5rem; }
  .content { padding: 0 .9rem 3rem; }
  .tabs { padding: 0 .9rem; }
  .stat-cards { grid-template-columns: repeat(2, 1fr); }
}

// ── Helpers ──────────────────────────────────────────────────────────────────
function heatBg(r) {
  const t = Math.max(0, Math.min(1, r));
  const ri = Math.round(240 + (29  - 240) * t);
  const gi = Math.round(243 + (68  - 243) * t);
  const bi = Math.round(255 + (196 - 255) * t);
  return `rgb(${ri},${gi},${bi})`;
}
function heatFg(r) { return r > 0.45 ? '#fff' : '#1a1f35'; }
function pct(n, d) { return d ? Math.round(n / d * 100) + '%' : '0%'; }
function fmt1(n) { return Number.isInteger(n) ? String(n) : n.toFixed(1); }
function escH(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function shortDate(d) {
  const p = d.split('-');
  return `Jul ${parseInt(p[2])}`;
}

// Collect all rewards and penalties from a test into flat lists
function allRewards(test) {
  return test.sections.flatMap(s => s.rewards);
}
function allPenalties(test) {
  const result = [];
  for (const s of test.sections) {
    for (const item of s.rewards) {
      for (const pen of item.penalties) {
        result.push({
          ...pen,
          context: item.label,
          parentType: item.type,
          parentAllCount:  item.all.totalCount,
          parentBestCount: item.best.totalCount,
        });
      }
    }
    for (const pen of s.penalties) {
      result.push({ ...pen, context: 'Standalone' });
    }
  }
  return result;
}

// ── Heat cell ─────────────────────────────────────────────────────────────────
function heatCell(scored, total) {
  const r = total ? scored / total : 0;
  const bg = heatBg(r);
  const fg = heatFg(r);
  const p  = pct(scored, total);
  return `<td class="heat" style="background:${bg};color:${fg}">${p}</td>`;
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  const d = DATA;
  const totalRuns = d.tests.reduce((s, t) => s + t.totalRuns, 0);
  const dates = [...new Set(d.tests.flatMap(t => t.progression.map(p => p.date)))].sort();
  const dateRange = dates.length > 1 ? `${shortDate(dates[0])}–${shortDate(dates[dates.length-1])} 2026` : `${shortDate(dates[0])} 2026`;

  document.getElementById('hdr-teams').textContent = `${d.competition.totalTeams} teams`;
  document.getElementById('hdr-tests').textContent = `${d.tests.length} tests`;
  document.getElementById('hdr-runs').textContent  = `${totalRuns} runs total`;
  document.getElementById('hdr-date').textContent  = dateRange;

  // Tabs
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  function addTab(label, id, first) {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (first ? ' active' : '');
    btn.textContent = label;
    btn.addEventListener('click', () => showPanel(id, btn));
    tabs.appendChild(btn);
  }
  addTab('Overview', 'overview-panel', true);
  d.tests.forEach(t => addTab(t.name, 'panel-' + t.id, false));

  renderOverview();
  d.tests.forEach(renderTest);

  document.getElementById('overview-panel').classList.add('visible');
}

function showPanel(id, btn) {
  document.querySelectorAll('.test-panel').forEach(p => p.classList.remove('visible'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('visible');
  btn.classList.add('active');
  btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
}

// Tests with a restricted/non-standard field — excluded from cross-test insight chips
const RESTRICTED_TESTS = new Set(['restaurant']);

// ── Overview ──────────────────────────────────────────────────────────────────
function renderOverview() {
  const d = DATA;
  const el = document.getElementById('overview-panel');

  // Compute insights — exclude restricted tests from cross-test comparisons
  let topItem = null, topRate = 0;
  let bottomItem = null, bottomRate = 1;
  let topPen = null, topPenRate = 0;
  let highAvgTest = null, lowAvgTest = null;
  for (const test of d.tests) {
    if (!RESTRICTED_TESTS.has(test.id)) {
      if (!highAvgTest || test.avgScore > highAvgTest.avgScore) highAvgTest = test;
      if (!lowAvgTest  || test.avgScore < lowAvgTest.avgScore)  lowAvgTest  = test;
    }
    for (const item of allRewards(test)) {
      const r = item.all.totalRuns ? item.all.timesScored / item.all.totalRuns : 0;
      if (r > topRate) { topRate = r; topItem = { label: item.label, test: test.name, rate: r }; }
      if (r > 0 && r < bottomRate) { bottomRate = r; bottomItem = { label: item.label, test: test.name, rate: r }; }
    }
    if (!RESTRICTED_TESTS.has(test.id)) {
      for (const pen of allPenalties(test)) {
        const r = pen.all.totalRuns ? pen.all.timesScored / pen.all.totalRuns : 0;
        if (r > topPenRate) { topPenRate = r; topPen = { label: pen.label, test: test.name, rate: r }; }
      }
    }
  }

  const maxAvg = Math.max(...d.tests.map(t => t.avgScore));

  el.innerHTML = `
    <div class="panel-section">
      <div class="panel-section-title">Competition Overview</div>
      <div class="insights">
        ${highAvgTest ? `<span class="chip chip-blue">Highest avg score: ${highAvgTest.name} (${Math.round(highAvgTest.avgScore)} pts)</span>` : ''}
        ${lowAvgTest ? `<span class="chip chip-amber">Lowest avg score: ${lowAvgTest.name} (${Math.round(lowAvgTest.avgScore)} pts)</span>` : ''}
        ${topItem ? `<span class="chip chip-green">Most scored item: "${escH(topItem.label)}" in ${escH(topItem.test)} (${Math.round(topItem.rate*100)}% of runs)</span>` : ''}
        ${bottomItem ? `<span class="chip chip-red">Rarest item scored: "${escH(bottomItem.label)}" in ${escH(bottomItem.test)} (${Math.round(bottomItem.rate*100)}% of runs)</span>` : ''}
        ${topPen ? `<span class="chip chip-amber">Most applied penalty: "${escH(topPen.label)}" in ${escH(topPen.test)} (${Math.round(topPen.rate*100)}% of runs)</span>` : ''}
      </div>

      <div class="table-card">
        <div class="table-wrap">
          <table class="data">
            <thead>
              <tr>
                <th>Test</th>
                <th>Runs</th>
                <th>Teams</th>
                <th>Avg Score</th>
                <th>Max Score</th>
                <th style="min-width:160px">Score Distribution</th>
                <th>Items Scored</th>
              </tr>
            </thead>
            <tbody>
              ${d.tests.map(t => {
                const rewards = allRewards(t);
                const everScored = rewards.filter(r => r.all.timesScored > 0).length;
                const barW = Math.round(t.avgScore / maxAvg * 100);
                const restricted = RESTRICTED_TESTS.has(t.id);
                return `<tr class="summary-row">
                  <td class="test-name">${escH(t.name)}${restricted ? ' <span style="font-size:10px;color:var(--muted);font-weight:400">*</span>' : ''}</td>
                  <td class="num">${t.totalRuns}</td>
                  <td class="num">${t.totalTeams}</td>
                  <td class="num">${Math.round(t.avgScore)} pts</td>
                  <td class="num">${t.maxScore} pts</td>
                  <td class="bar-cell">
                    <div style="font-family:var(--mono);font-size:11px;color:var(--muted)">${Math.round(t.avgScore)} avg / ${t.maxScore} max</div>
                    <div class="mini-bar-wrap"><div class="mini-bar" style="width:${barW}%"></div></div>
                  </td>
                  <td class="num">${everScored} / ${rewards.length}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>
      <p style="font-size:11px;color:var(--muted);margin-top:.6rem">* Restaurant was run with the top 12 qualified teams only and is excluded from cross-test comparisons above.</p>
    </div>
  `;
}

// ── Per-test panel ─────────────────────────────────────────────────────────────
function renderTest(test) {
  const container = document.getElementById('test-panels');
  const div = document.createElement('div');
  div.className = 'test-panel';
  div.id = 'panel-' + test.id;
  container.appendChild(div);

  const allR  = allRewards(test);
  const allP  = allPenalties(test);
  const neverScored = allR.filter(r => r.all.timesScored === 0).length;
  const topItem = [...allR].sort((a,b) => (b.all.timesScored/b.all.totalRuns||0) - (a.all.timesScored/a.all.totalRuns||0))[0];

  div.innerHTML = `
    <div class="stat-cards">
      <div class="stat-card">
        <div class="stat-label">Total Runs</div>
        <div class="stat-value">${test.totalRuns}</div>
        <div class="stat-sub">${test.totalTeams} teams</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Avg Score</div>
        <div class="stat-value">${Math.round(test.avgScore)}</div>
        <div class="stat-sub">pts per run</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Max Score</div>
        <div class="stat-value">${test.maxScore}</div>
        <div class="stat-sub">pts (best run)</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Score Range</div>
        <div class="stat-value">${test.maxScore - test.minScore}</div>
        <div class="stat-sub">max − min</div>
      </div>
      <div class="stat-card ${neverScored > 0 ? 'highlight' : ''}">
        <div class="stat-label">Untouched Items</div>
        <div class="stat-value">${neverScored}</div>
        <div class="stat-sub">of ${allR.length} scored items</div>
      </div>
    </div>

    ${renderProgression(test)}
    ${renderRewardsTable(test)}
    ${renderPenaltiesTable(test, allP)}
  `;
}

// ── Progression ───────────────────────────────────────────────────────────────
function renderProgression(test) {
  const prog = test.progression;
  if (prog.length <= 1) {
    return `<div class="panel-section">
      <div class="panel-section-title">Day-by-Day Progression</div>
      <div class="no-prog">Only one session recorded — no progression data to display.</div>
    </div>`;
  }

  const maxAvg = Math.max(...prog.map(p => p.avgScore));
  const dayBars = prog.map((p, i) => {
    const barW = Math.round(p.avgScore / maxAvg * 100);
    const prev = i > 0 ? prog[i-1].avgScore : null;
    const delta = prev != null ? p.avgScore - prev : null;
    const deltaHtml = delta != null
      ? `<div class="prog-delta ${delta >= 0 ? 'delta-up' : 'delta-dn'}">${delta >= 0 ? '↑' : '↓'} ${Math.abs(Math.round(delta))} pts</div>`
      : '';
    return `<div class="prog-day">
      <div class="prog-day-label">${shortDate(p.date)} · ${p.runCount} runs</div>
      <div class="prog-bar-wrap"><div class="prog-bar" style="width:${barW}%"></div></div>
      <div class="prog-score">${Math.round(p.avgScore)}<span style="font-size:.8rem;font-weight:400;color:var(--muted)"> pts avg</span></div>
      ${deltaHtml}
    </div>`;
  }).join('');

  // Item rate heat grid — top 8 items by overall uptake (that have any uptake)
  const rewards = allRewards(test);
  const itemsWithData = rewards
    .filter(r => prog.some(p => (p.itemRates[r.id] || 0) > 0))
    .sort((a, b) => (b.all.timesScored/b.all.totalRuns||0) - (a.all.timesScored/a.all.totalRuns||0))
    .slice(0, 8);

  const gridRows = itemsWithData.map(item => {
    const cells = prog.map(p => {
      const r = p.itemRates[item.id] || 0;
      const bg = heatBg(r);
      const fg = heatFg(r);
      return `<td class="heat-cell" style="background:${bg};color:${fg};padding:.35rem .5rem;text-align:center;border-bottom:1px solid #edf0f7">${Math.round(r*100)}%</td>`;
    }).join('');
    return `<tr><td class="item-name" style="padding:.35rem .75rem;border-bottom:1px solid #edf0f7;font-size:12px">${escH(item.label)}</td>${cells}</tr>`;
  }).join('');

  const dateCols = prog.map(p => `<th style="text-align:center">${escH(shortDate(p.date))}</th>`).join('');

  return `<div class="panel-section">
    <div class="panel-section-title">Day-by-Day Progression</div>
    <div class="prog-days">${dayBars}</div>
    ${itemsWithData.length ? `<div class="prog-grid-wrap">
      <table class="prog-grid-table" style="background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-top:1rem;border-collapse:collapse">
        <thead><tr>
          <th style="text-align:left;padding:.45rem .75rem;border-bottom:2px solid var(--border)">Item</th>
          ${dateCols}
        </tr></thead>
        <tbody>${gridRows}</tbody>
      </table>
    </div>` : ''}
  </div>`;
}

// ── Rewards table ─────────────────────────────────────────────────────────────
function renderRewardsTable(test) {
  const rows = [];
  for (const section of test.sections) {
    if (!section.rewards.length) continue;
    rows.push(`<tr class="section-row"><td colspan="9">${escH(section.heading)}</td></tr>`);
    for (const item of section.rewards) {
      const isCount = item.type === 'count';
      const maxC    = item.maxCount || null;

      const allNum  = isCount ? item.all.totalCount  : item.all.timesScored;
      const allDen  = isCount && maxC ? maxC * item.all.totalRuns  : item.all.totalRuns;
      const bestNum = isCount ? item.best.totalCount : item.best.timesScored;
      const bestDen = isCount && maxC ? maxC * item.best.totalRuns : item.best.totalRuns;

      const typeTag = isCount ? ' <span style="font-size:10px;color:var(--muted);font-weight:600">×' + (maxC||'∞') + '</span>' : '';
      rows.push(`<tr>
        <td class="item-label">${escH(item.label)}${typeTag}</td>
        <td class="pts">${item.points > 0 ? '+' + item.points : '—'}</td>
        <td class="num">${allNum} / ${allDen}</td>
        ${heatCell(allNum, allDen)}
        <td class="num">${item.all.uniqueTeams} / ${test.totalTeams}</td>
        <td class="num">${bestNum} / ${bestDen}</td>
        ${heatCell(bestNum, bestDen)}
        <td class="num">${item.best.uniqueTeams} / ${test.totalTeams}</td>
      </tr>`);
    }
  }

  return `<div class="panel-section">
    <div class="panel-section-title">Scoring Items</div>
    <div class="table-card">
      <div class="table-wrap">
        <table class="data">
          <thead>
            <tr>
              <th rowspan="2">Item</th>
              <th rowspan="2">Pts</th>
              <th colspan="3" class="g-all" style="text-align:center;border-bottom:1px solid #cdd4e6">All Runs</th>
              <th colspan="3" class="g-best" style="text-align:center;border-bottom:1px solid #cdd4e6">Best Runs</th>
            </tr>
            <tr>
              <th class="g-all">Scored / Total</th>
              <th class="g-all">% Runs</th>
              <th class="g-all">Teams</th>
              <th class="g-best">Scored / Total</th>
              <th class="g-best">% Teams</th>
              <th class="g-best">Teams</th>
            </tr>
          </thead>
          <tbody>${rows.join('')}</tbody>
        </table>
      </div>
    </div>
  </div>`;
}

// ── Penalties table ───────────────────────────────────────────────────────────
function renderPenaltiesTable(test, penalties) {
  if (!penalties.length) return '';
  const rows = penalties.map(pen => {
    const isCountParent = pen.parentType === 'count';

    // For count-type parents, show per-instance rates (how often penalty fires per item attempt)
    const allNum  = isCountParent ? pen.all.totalCount   : pen.all.timesScored;
    const allDen  = isCountParent ? pen.parentAllCount   : pen.all.totalRuns;
    const bestNum = isCountParent ? pen.best.totalCount  : pen.best.timesScored;
    const bestDen = isCountParent ? pen.parentBestCount  : pen.best.totalRuns;

    const cntAll  = (!isCountParent && pen.all.totalCount > 0)
      ? ` <span style="font-size:11px;color:var(--muted)">(${pen.all.totalCount}×)</span>` : '';
    const cntBest = (!isCountParent && pen.best.totalCount > 0)
      ? ` <span style="font-size:11px;color:var(--muted)">(${pen.best.totalCount}×)</span>` : '';
    const perItem = isCountParent
      ? ' <span style="font-size:10px;color:var(--muted);font-style:italic">per item</span>' : '';

    const pts = pen.type === 'percentage' ? '% of base' : '−' + pen.points;
    return `<tr>
      <td class="item-label penalty">${escH(pen.label)}${perItem}</td>
      <td class="context">${escH(pen.context === 'Standalone' ? '—' : pen.context)}</td>
      <td class="num" style="color:var(--accent);font-weight:700">${pts}</td>
      <td class="num">${allDen ? `${allNum} / ${allDen}` : '—'}${cntAll}</td>
      ${heatCell(allNum, allDen)}
      <td class="num">${pen.all.uniqueTeams} / ${test.totalTeams}</td>
      <td class="num">${bestDen ? `${bestNum} / ${bestDen}` : '—'}${cntBest}</td>
      ${heatCell(bestNum, bestDen)}
      <td class="num">${pen.best.uniqueTeams} / ${test.totalTeams}</td>
    </tr>`;
  }).join('');

  return `<div class="panel-section">
    <div class="panel-section-title">Penalties</div>
    <div class="table-card">
      <div class="table-wrap">
        <table class="data">
          <thead>
            <tr>
              <th rowspan="2">Penalty</th>
              <th rowspan="2">Applies to</th>
              <th rowspan="2">Pts</th>
              <th colspan="3" class="g-all" style="text-align:center;border-bottom:1px solid #cdd4e6">All Runs</th>
              <th colspan="3" class="g-best" style="text-align:center;border-bottom:1px solid #cdd4e6">Best Runs</th>
            </tr>
            <tr>
              <th class="g-all">Applied / Total</th>
              <th class="g-all">% Runs</th>
              <th class="g-all">Teams</th>
              <th class="g-best">Applied / Total</th>
              <th class="g-best">% Runs</th>
              <th class="g-best">Teams</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
  </div>`;
}

render();
</script>
